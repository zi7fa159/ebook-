<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
    <!-- Simplified representation of Guppy Lifecycle for placeholder purposes -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
        </marker>
    </defs>

    <!-- Fry -->
    <ellipse cx="30" cy="75" rx="10" ry="5" fill="#ADD8E6" stroke="#333" stroke-width="1"/>
    <text x="20" y="95" font-family="Roboto, sans-serif" font-size="10px" fill="#333">Fry</text>

    <!-- Arrow 1 -->
    <line x1="45" y1="75" x2="75" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <text x="50" y="65" font-family="Roboto, sans-serif" font-size="8px" fill="#555">Grows</text>

    <!-- Juvenile -->
    <ellipse cx="100" cy="75" rx="20" ry="10" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <text x="80" y="100" font-family="Roboto, sans-serif" font-size="10px" fill="#333">Juvenile</text>

    <!-- Arrow 2 -->
    <line x1="125" y1="75" x2="155" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
     <text x="130" y="65" font-family="Roboto, sans-serif" font-size="8px" fill="#555">Matures</text>

    <!-- Adult -->
    <ellipse cx="175" cy="75" rx="25" ry="15" fill="#4682B4" stroke="#333" stroke-width="1"/>
    <text x="160" y="105" font-family="Roboto, sans-serif" font-size="10px" fill="#333">Adult</text>

    <!-- Arrow 3 (Breeding loop) -->
    <path d="M 175 60 Q 175 30 100 30 Q 25 30 30 60" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <text x="85" y="25" font-family="Roboto, sans-serif" font-size="8px" fill="#555">Breeds</text>

    <rect x="0" y="0" width="200" height="150" fill="none" stroke="#ccc" stroke-width="1" />
    <text x="50" y="140" font-family="Montserrat, sans-serif" font-size="12px" fill="#333">Guppy Lifecycle</text>
</svg>
