<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLucky - High Performance Lucky Imaging</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #2d2d2d;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #444;
        }
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 300px;
            background-color: #252525;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow-y: auto;
        }
        #viewport {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }
        .controls {
            margin-bottom: 1rem;
        }
        button {
            background-color: #3d3d3d;
            color: white;
            border: 1px solid #555;
            padding: 0.5rem 1rem;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #4d4d4d;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        label {
            display: block;
            margin-bottom: 0.2rem;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 100%;
        }
        #stats {
            margin-top: auto;
            font-size: 0.8rem;
            color: #aaa;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>OpenLucky</h1>
    </header>
    <main>
        <div id="sidebar">
            <div class="controls">
                <input type="file" id="fileInput" accept=".ser,.mp4,.mov,.fits,.fit">
            </div>
            <div id="fileInfo">
                <p>No file loaded</p>
            </div>
            <div class="controls">
                <button id="stackBtn" disabled>Stack Selected Frames</button>
            </div>
            <div class="controls">
                <button id="exportBtn" disabled>Export Result (PNG)</button>
            </div>
            <div class="controls">
                <label for="frameRange">Frame: <span id="frameNum">0</span></label>
                <input type="range" id="frameRange" min="0" max="0" value="0" disabled>
            </div>
            <div class="controls">
                <label>Wavelets Detail Layer 1</label>
                <input type="range" id="waveletLayer1" min="0" max="5" step="0.1" value="1">
                <label>Wavelets Detail Layer 2</label>
                <input type="range" id="waveletLayer2" min="0" max="5" step="0.1" value="1">
            </div>
            <div id="stats"></div>
        </div>
        <div id="viewport">
            <canvas id="mainCanvas"></canvas>
        </div>
    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
