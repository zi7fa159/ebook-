<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Lucky Imager</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #252526;
            --border-color: #3e3e42;
            --text-color: #cccccc;
            --accent-color: #007acc;
            --header-height: 30px;
            --footer-height: 25px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #app {
            display: grid;
            grid-template-rows: var(--header-height) 1fr var(--footer-height);
            width: 100vw;
            height: 100vh;
        }

        header {
            background-color: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            user-select: none;
        }

        main {
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .panel {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background-color: #2d2d2d;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #left-sidebar {
            width: 300px;
            min-width: 200px;
        }

        #center-view {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #right-sidebar {
            width: 300px;
            min-width: 200px;
        }

        .resizer {
            width: 4px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.2s;
        }

        .resizer:hover {
            background-color: var(--accent-color);
        }

        #viewport {
            flex: 1;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        footer {
            background-color: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 11px;
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .btn {
            background: #3e3e42;
            border: 1px solid #454545;
            color: #eee;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn:hover {
            background: #4e4e52;
        }

        .btn:active {
            background: var(--accent-color);
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div style="margin-right: 20px; font-weight: bold;">LUMINA LUCKY IMAGER</div>
            <div id="menu-bar">File Edit View Process Help</div>
        </header>
        <main>
            <div id="left-sidebar" class="panel">
                <div class="panel-header">Workflow</div>
                <div class="scrollable">
                    <div class="section">
                        <h4>Import</h4>
                        <button class="btn" id="btn-open-file">Open File...</button>
                        <button class="btn" id="btn-open-folder">Open Folder...</button>
                    </div>
                    <div class="section">
                        <h4>Analysis</h4>
                        <button class="btn" id="btn-analyze" disabled>Analyze Frames</button>
                    </div>
                    <div class="section">
                        <h4>Registration</h4>
                        <button class="btn" id="btn-register" disabled>Register Frames</button>
                    </div>
                    <div class="section">
                        <h4>Stacking</h4>
                        <label>Stack Top %: <input type="number" id="stack-percent" value="25" min="1" max="100"></label>
                        <button class="btn" id="btn-stack" disabled>Stack Frames</button>
                    </div>
                    <div class="section">
                        <h4>Post-Processing</h4>
                        <div>
                            Wavelet Layer 1: <input type="range" id="wavelet-1" min="0" max="5" step="0.1" value="1">
                        </div>
                        <div>
                            Wavelet Layer 2: <input type="range" id="wavelet-2" min="0" max="5" step="0.1" value="1">
                        </div>
                        <button class="btn" id="btn-apply-wavelets" disabled>Apply Wavelets</button>
                        <div style="margin-top: 10px;">
                            Unsharp Amount: <input type="range" id="unsharp-amount" min="0" max="5" step="0.1" value="1">
                        </div>
                        <button class="btn" id="btn-apply-unsharp" disabled>Apply Unsharp Mask</button>
                    </div>
                    <div class="section">
                        <h4>Export</h4>
                        <button class="btn" id="btn-export" disabled>Export as PNG</button>
                    </div>
                </div>
            </div>
            <div class="resizer" id="resizer-left"></div>
            <div id="center-view">
                <div id="viewport" class="panel">
                    <div class="panel-header">Image Preview <span id="frame-info">No image loaded</span></div>
                    <canvas id="main-canvas"></canvas>
                </div>
                <div class="panel" style="height: 200px;">
                    <div class="panel-header">Analysis</div>
                    <div id="analysis-chart" class="scrollable">
                        Graph will appear here...
                    </div>
                </div>
            </div>
            <div class="resizer" id="resizer-right"></div>
            <div id="right-sidebar" class="panel">
                <div class="panel-header">Controls</div>
                <div class="scrollable">
                    <!-- Controls for each stage -->
                    <div id="controls-container"></div>
                </div>
            </div>
        </main>
        <footer>
            <div id="status-bar">Ready</div>
        </footer>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
