<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript Blog Index</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN for a lightweight client-side Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/lib/marked.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>javascript Blog</h1>
    </header>
    <main>
        <aside id="post-list-container">
            <h2>All Posts</h2>
            <ul id="post-list">
                <!-- Post titles will be loaded here by JavaScript -->
            </ul>
        </aside>
        <article id="post-display">
            <div id="post-content">
                <p>Select a post from the left to view its content.</p>
            </div>
            <button id="copy-markdown-btn" style="display:none;">Copy Markdown</button>
        </article>
    </main>
    <script src="script.js"></script>
</body>
</html>
